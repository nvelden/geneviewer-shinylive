name: CourtReserve 4.0 Registration Bot

on:
  # Manual trigger - run whenever you want
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: 'false'
        type: boolean

  # Scheduled runs - customize these times
  schedule:
    # Run at 7:00 AM AST (UTC-4) on Mon, Tue, Thu
    - cron: '0 11 * * 1,2,4'

jobs:
  register:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Install Chrome and ChromeDriver
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

          CHROME_VERSION=$(google-chrome --version | cut -d " " -f3 | cut -d "." -f1)
          CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")
          wget -O /tmp/chromedriver.zip "https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
          sudo unzip /tmp/chromedriver.zip -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Run registration script
        env:
          USERNAME: ${{ secrets.COURTRESERVE_USERNAME }}
          PASSWORD: ${{ secrets.COURTRESERVE_PASSWORD }}
        run: |
          python courtreserve.py

      - name: Upload logs (if any)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: registration-logs
          path: |
            *.log
            *.png
          retention-days: 7